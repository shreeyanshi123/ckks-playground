services:
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ckks-server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ckks-client
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
    restart: unless-stopped

networks:
  default:
    name: ckks-network
